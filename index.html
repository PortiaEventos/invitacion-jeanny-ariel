<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jeanny & Ariel · 15.11.2026</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#f7f1e7;color:#214a9a}
body{overflow-x:hidden;font-family:Georgia,serif}
.invite{width:min(100vw,944px);margin:0 auto;background:#f7f1e7}
.page{position:relative;width:100%;overflow:hidden}
.page>img{display:block;width:100%;height:auto}
.reveal{opacity:0;transform:translateY(14px) scale(.997);transition:opacity 1s ease,transform 1.1s cubic-bezier(.2,.75,.2,1)}
.reveal.on{opacity:1;transform:none}

/* PORTADA: dos archivos físicos, uno por cada mitad. No puede duplicarse la portada completa. */
.cover{position:fixed;z-index:100;inset:0;background:#f7f1e7;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:manipulation;transition:opacity .35s ease .95s}
.cover.open{pointer-events:none;opacity:0}
.doors{position:relative;width:min(100vw,calc(100vh * 944 / 2048),944px);aspect-ratio:944/2048;overflow:visible}
.door{position:absolute;top:0;width:50%;height:100%;overflow:hidden;transition:transform 1.15s cubic-bezier(.65,0,.25,1);will-change:transform}
.door img{display:block;width:100%;height:100%;object-fit:fill}
.left{left:0;transform-origin:left center}
.right{right:0;transform-origin:right center}
.cover.open .left{transform:translateX(-103%)}
.cover.open .right{transform:translateX(103%)}
.tap{position:absolute;z-index:10;left:50%;top:61.5%;transform:translate(-50%,-50%);width:48%;height:10%;border:0;background:transparent;cursor:pointer;padding:0}

.hot{position:absolute;z-index:20;display:block;border-radius:999px}
.loc{left:31%;top:70.8%;width:38%;height:5.5%}
.women{left:31%;top:51.2%;width:38%;height:4.6%}
.men{left:29%;top:91.1%;width:42%;height:4.8%}
.cuesta{left:31%;top:40.2%;width:38%;height:4.7%}
.amazon{left:31%;top:50.4%;width:38%;height:4.7%}

.music{position:fixed;right:14px;top:max(14px,env(safe-area-inset-top));z-index:90;width:42px;height:42px;border-radius:50%;border:1px solid rgba(31,70,145,.25);background:rgba(249,245,237,.88);backdrop-filter:blur(7px);font-size:18px;color:#214a9a;display:none;align-items:center;justify-content:center;box-shadow:0 3px 15px rgba(0,0,0,.08)}
.music.show{display:flex}

/* Agua sutil */
.water{position:absolute;pointer-events:none;z-index:4;overflow:hidden;opacity:.42}
.water:before,.water:after{content:"";position:absolute;inset:-22% 0;background:repeating-linear-gradient(100deg,transparent 0 8%,rgba(255,255,255,.62) 9% 10%,rgba(185,211,222,.18) 11% 12%,transparent 13% 22%);filter:blur(.45px);animation:flow 1.45s linear infinite}
.water:after{opacity:.4;animation-duration:2.05s;transform:translateX(8%)}
@keyframes flow{from{transform:translateY(-18%)}to{transform:translateY(18%)}}
.w2{left:42.5%;top:73.4%;width:15%;height:7.2%;border-radius:45%}
.w5{left:78.5%;top:78.5%;width:17%;height:9%;border-radius:45%}

/* Cintas: movimiento mínimo, conservando la acuarela */
.ribbon{position:absolute;inset:0;z-index:3;pointer-events:none;background:url('assets/02-apertura-final.png?v=v3') center top/100% auto no-repeat;animation:ribbonBreeze 8s ease-in-out infinite;will-change:transform}
.rleft{clip-path:polygon(0 43%,25% 43%,29% 73%,10% 75%);transform-origin:22% 44%}
.rright{clip-path:polygon(75% 43%,100% 43%,92% 76%,70% 73%);transform-origin:78% 44%;animation-delay:-3s}
@keyframes ribbonBreeze{0%,38%,100%{transform:rotate(0deg) translateX(0)}48%{transform:rotate(.28deg) translateX(1px)}60%{transform:rotate(-.2deg) translateX(-1px)}72%{transform:rotate(0deg)}}
@media(max-width:600px){.reveal{transform:translateY(10px) scale(.998)}.music{right:10px;width:39px;height:39px}.ribbon{animation-duration:9s}}
</style>
</head>
<body>
<audio id="song" preload="auto" playsinline loop><source src="assets/spring-max-richter.mp3?v=v3" type="audio/mpeg"></audio>
<button id="music" class="music" aria-label="Silenciar música">♫</button>

<div class="invite" id="invite">
  <section class="page reveal" id="p2">
    <img src="assets/02-apertura-final.png?v=v3" alt="Jeanny y Ariel">
    <span class="ribbon rleft"></span><span class="ribbon rright"></span><span class="water w2"></span>
  </section>
  <section class="page reveal">
    <img src="assets/03-boda-final.png?v=v3" alt="Detalles de la boda">
    <a class="hot loc" href="https://maps.app.goo.gl/bXNYkKEkYui6yCsP8?g_st=ic" target="_blank" rel="noopener" aria-label="Ver ubicación"></a>
  </section>
  <section class="page reveal">
    <img src="assets/04-vestimenta-final.png?v=v3" alt="Código de vestimenta">
    <a class="hot women" href="https://www.pinterest.com/turtle_uv94/code-dress-girls/?invite_code=2acb87ba884a4c9c999840964b3e6c9f&sender=549931941906887975" target="_blank" rel="noopener" aria-label="Referencias para ellas"></a>
    <a class="hot men" href="https://www.pinterest.com/turtle_uv94/code-dress-boys/?invite_code=ddfad047927e46b4bc0679652ee8c017&sender=549931941906887975" target="_blank" rel="noopener" aria-label="Referencias para ellos"></a>
  </section>
  <section class="page reveal">
    <img src="assets/05-regalos-final.png?v=v3" alt="Listas de regalos">
    <a class="hot cuesta" href="https://listaderegalos.casacuesta.com/Event/Jeanny-Ariel?utm_source=share" target="_blank" rel="noopener" aria-label="Lista Casa Cuesta"></a>
    <a class="hot amazon" href="https://www.amazon.com/wedding/guest-view/SKL6AKIKFPXG" target="_blank" rel="noopener" aria-label="Lista Amazon"></a>
    <span class="water w5"></span>
  </section>
</div>

<div class="cover" id="cover">
  <div class="doors">
    <div class="door left"><img src="assets/01-puerta-izquierda.png?v=v3" alt=""></div>
    <div class="door right"><img src="assets/01-puerta-derecha.png?v=v3" alt=""></div>
    <button class="tap" id="open" aria-label="Toca para abrir"></button>
  </div>
</div>

<script>
const audio=document.getElementById('song');
const cover=document.getElementById('cover');
const openBtn=document.getElementById('open');
const music=document.getElementById('music');
audio.volume=.38;
let opened=false;
function openInvite(){
  if(opened)return; opened=true;
  const p=audio.play(); if(p&&p.catch)p.catch(()=>{});
  music.classList.add('show');
  cover.classList.add('open');
  document.getElementById('p2').classList.add('on');
  setTimeout(()=>{cover.style.display='none'},1400);
}
openBtn.addEventListener('pointerup',openInvite,{passive:true});
openBtn.addEventListener('click',openInvite);
music.addEventListener('click',()=>{
  if(audio.paused){audio.play().catch(()=>{});music.textContent='♫';music.setAttribute('aria-label','Silenciar música')}
  else{audio.pause();music.textContent='♪̸';music.setAttribute('aria-label','Activar música')}
});
const io=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting)e.target.classList.add('on')}),{threshold:.15});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
</script>
</body>
</html>
