html,body{margin:0;background:#f7f1e7;color:#214a9a}

.invite{width:min(100vw,944px);margin:0 auto;background:#f7f1e7}
.page{position:relative;width:100%;overflow:hidden;aspect-ratio:944/2048;background:#f7f1e7}
.base{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;z-index:1}

.pageReveal.on{opacity:1;transform:none}

/* Full-size artwork duplicated and clipped into independent animated blocks. This keeps the Canva design pixel-perfect. */
.art{position:absolute;inset:0;z-index:5;width:100%;height:100%;pointer-events:none;opacity:0;transform:translate3d(0,14px,0) scale(.992);transition:opacity .72s ease,transform .9s cubic-bezier(.18,.78,.2,1);will-change:opacity,transform}

.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block}
.d1{transition-delay:.08s}.d2{transition-delay:.28s}.d3{transition-delay:.50s}.d4{transition-delay:.72s}.d5{transition-delay:.94s}.d6{transition-delay:1.16s}.d7{transition-delay:1.38s}

/* Page 2: side doors and ribbons NEVER transform. Only central garden gets a tiny continuous zoom. */
.sceneZoom{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden;clip-path:inset(18% 23% 0 23%)}
.sceneZoom img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;transform:scale(1);transform-origin:50% 68%;will-change:transform}
.sceneZoom.go img{animation:enterGarden 1.35s cubic-bezier(.18,.82,.24,1) both}

.cover{position:fixed;z-index:100;inset:0;background:#f7f1e7;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:manipulation;transition:opacity .22s ease .98s}
.cover.open{pointer-events:none;opacity:0}
.doors{position:relative;width:min(100vw,calc(100vh * 944 / 2048),944px);aspect-ratio:944/2048;overflow:hidden}

.door img{display:block;width:100%;height:100%;object-fit:fill;transform:none!important}
.left{left:0;transform-origin:left center}.right{right:0;transform-origin:right center}

.tap{position:absolute;z-index:10;left:50%;top:61.5%;transform:translate(-50%,-50%);width:48%;height:10%;border:0;background:transparent;cursor:pointer;padding:0;touch-action:manipulation}

.hot{position:absolute;z-index:30;display:block;border-radius:999px}

/* Water effect: always running, GPU-backed, no dependency on scroll animation. */
.water{position:absolute;pointer-events:none;z-index:9;overflow:hidden;opacity:.86;mix-blend-mode:screen;transform:translateZ(0);will-change:transform,opacity}
.water:before,.water:after{content:"";position:absolute;left:-12%;right:-12%;top:-35%;height:170%;background:repeating-linear-gradient(101deg,transparent 0 8%,rgba(255,255,255,.72) 9% 10%,rgba(184,213,226,.23) 11% 12%,transparent 13% 22%);background-size:100% 64%;filter:blur(.2px);animation:waterFlow 1.0s linear infinite;will-change:transform}
.water:after{opacity:.46;animation-duration:1.85s;animation-delay:-.6s}
@keyframes waterFlow{from{transform:translate3d(0,-16%,0)}to{transform:translate3d(0,16%,0)}}

@media(max-width:600px){.art{transform:translate3d(0,10px,0) scale(.994)}.music{right:10px;width:39px;height:39px}.pageReveal{transform:translateY(7px)}}

<script>
const audio=document.getElementById('song');
const cover=document.getElementById('cover');
const openBtn=document.getElementById('open');
const music=document.getElementById('music');
const p2=document.getElementById('p2');
const sceneZoom=document.getElementById('sceneZoom');
audio.volume=.38;
let opened=false;

function openInvite(){
  if(opened)return;
  opened=true;
  // Must happen synchronously inside the user's tap for iOS/Android audio permission.
  audio.play().catch(()=>{});
  music.classList.add('show');
  // Start the reveal and garden zoom immediately, while the doors are moving.
  p2.classList.add('on');
  sceneZoom.classList.add('go');
  cover.classList.add('open');
  setTimeout(()=>{cover.style.display='none'},1350);
}
openBtn.addEventListener('pointerup',openInvite,{passive:true});
openBtn.addEventListener('click',openInvite);

music.addEventListener('click',()=>{
  if(audio.paused){audio.play().catch(()=>{});music.textContent='♫'}
  else{audio.pause();music.textContent='♪̸'}
});

const io=new IntersectionObserver(entries=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting) entry.target.classList.add('on');
  });
},{threshold:.16,rootMargin:'0px 0px -6% 0px'});
document.querySelectorAll('.pageReveal:not(#p2)').forEach(el=>io.observe(el));
</script>
