<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Jeanny & Ariel</title>
<style>
  *{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;background:#f6f1e8;font-family:Georgia,serif;color:#244b99}
  body.locked{overflow:hidden}
  .invite{width:min(100%,430px);margin:0 auto;background:#f8f2e7;position:relative;box-shadow:0 0 30px rgba(0,0,0,.08)}
  .page{display:block;width:100%;height:auto;margin:0;padding:0}
  .page-wrap{position:relative;line-height:0}
  .hotspot{position:absolute;display:block;z-index:5;border-radius:999px}
  .hotspot:focus{outline:2px solid rgba(36,75,153,.45);outline-offset:2px}
  /* Hotspots listos para activar cuando tengamos los enlaces */
  #location{left:34%;top:78.7%;width:31%;height:3.6%}
  #dress-women{left:40%;top:48.0%;width:30%;height:3.4%}
  #dress-men{left:40%;top:90.0%;width:30%;height:3.4%}
  #casa-cuesta{left:35%;top:39.1%;width:31%;height:3.6%}
  #amazon{left:35%;top:48.8%;width:31%;height:3.6%}

  .cover{position:fixed;inset:0;z-index:50;background:#f6f1e8;display:flex;justify-content:center;align-items:flex-start;overflow:hidden;touch-action:manipulation;cursor:pointer}
  .cover-stage{position:relative;width:min(100vw,430px);height:min(100dvh,932px);aspect-ratio:430/932;overflow:hidden;background:#f8f2e7}
  .door-half{position:absolute;inset:0;overflow:hidden;will-change:transform,opacity;transition:transform 1.15s cubic-bezier(.65,0,.2,1),opacity .85s ease}
  .door-half img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none}
  .door-left{clip-path:inset(0 50% 0 0);transform-origin:left center}
  .door-right{clip-path:inset(0 0 0 50%);transform-origin:right center}
  .cover.open .door-left{transform:perspective(1000px) rotateY(-72deg) translateX(-12%);opacity:.35}
  .cover.open .door-right{transform:perspective(1000px) rotateY(72deg) translateX(12%);opacity:.35}
  .reveal{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1;transform:scale(.985);transition:transform 1.15s ease}
  .cover.open .reveal{transform:scale(1)}
  .tap-zone{position:absolute;left:34%;top:57%;width:32%;height:8%;z-index:60}
  .cover.done{opacity:0;pointer-events:none;transition:opacity .35s ease}
  @media (min-width:431px){.cover-stage{height:100dvh;width:auto;max-width:430px}.invite{min-height:100vh}}
  @media (prefers-reduced-motion:reduce){.door-half,.reveal,.cover.done{transition-duration:.01ms!important}}
</style>
</head>
<body class="locked">
  <div class="cover" id="cover" aria-label="Toca para abrir la invitación">
    <div class="cover-stage">
      <img class="reveal" src="assets/02-apertura.png" alt="Jeanny y Ariel" />
      <div class="door-half door-left"><img src="assets/01-portada.png" alt="" /></div>
      <div class="door-half door-right"><img src="assets/01-portada.png" alt="" /></div>
      <button class="tap-zone" id="openBtn" aria-label="Toca para abrir" style="opacity:0;border:0;background:transparent"></button>
    </div>
  </div>

  <main class="invite" id="invite">
    <div class="page-wrap"><img class="page" src="assets/02-apertura.png" alt="Jeanny y Ariel, 15 de noviembre de 2026" /></div>
    <div class="page-wrap">
      <img class="page" src="assets/03-boda.png" alt="Información de la boda" />
      <a class="hotspot" id="location" aria-label="Ver ubicación"></a>
    </div>
    <div class="page-wrap">
      <img class="page" src="assets/04-vestuario.png" alt="Código de vestimenta" />
      <a class="hotspot" id="dress-women" aria-label="Ver referencias para ellas"></a>
      <a class="hotspot" id="dress-men" aria-label="Ver referencias para ellos"></a>
    </div>
    <div class="page-wrap">
      <img class="page" src="assets/05-regalos.png" alt="Listas de regalos" />
      <a class="hotspot" id="casa-cuesta" aria-label="Ver lista Casa Cuesta"></a>
      <a class="hotspot" id="amazon" aria-label="Ver lista Amazon"></a>
    </div>
  </main>
<script>
  // Cuando me pases los links, los colocamos aquí sin cambiar el diseño.
  const links = {
    location: '',
    'dress-women': '',
    'dress-men': '',
    'casa-cuesta': '',
    amazon: ''
  };
  Object.entries(links).forEach(([id,url])=>{
    const el=document.getElementById(id);
    if(url){el.href=url;el.target='_blank';el.rel='noopener noreferrer';}
  });

  const cover=document.getElementById('cover');
  const open=()=>{
    if(cover.classList.contains('open')) return;
    cover.classList.add('open');
    setTimeout(()=>{
      cover.classList.add('done');
      document.body.classList.remove('locked');
      window.scrollTo({top:0,left:0,behavior:'instant'});
      setTimeout(()=>cover.remove(),400);
    },1150);
  };
  document.getElementById('openBtn').addEventListener('click',open);
  cover.addEventListener('click',open);
</script>
</body>
</html>
