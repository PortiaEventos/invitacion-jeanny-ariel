<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f1e7">
<title>Jeanny & Ariel</title>

<link rel="preload" as="image" href="assets/01-portada.png">
<link rel="preload" as="image" href="assets/02-apertura.png">

<style>
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    background:#f7f1e7;
    color:#244b99;
    font-family:Georgia,serif;
  }
  body.locked{overflow:hidden}

  .invite{
    width:min(100%,472px);
    margin:0 auto;
    background:#f8f2e7;
    position:relative;
    overflow:hidden;
  }
  .page-wrap{
    position:relative;
    line-height:0;
    overflow:hidden;
  }
  .page{
    display:block;
    width:100%;
    height:auto;
    margin:0;
  }

  /* Zonas clicables invisibles sobre los botones de Canva */
  .hotspot{
    position:absolute;
    z-index:30;
    display:block;
    border:0;
    background:transparent;
    border-radius:999px;
    cursor:pointer;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
  }

  /* Pág. 2: "Desliza para descubrir" */
  #scroll-details{left:30%;top:43.8%;width:40%;height:7%}

  /* Pág. 3: ubicación + seguir bajando */
  #location{left:30%;top:83.2%;width:40%;height:5.5%}
  #scroll-dress{left:29%;top:89.0%;width:42%;height:7.5%}

  /* Pág. 4: referencias de vestimenta */
  #dress-women{left:34%;top:50.0%;width:34%;height:6.5%}
  #dress-men{left:34%;top:90.0%;width:34%;height:7%}

  /* Pág. 5: listas de regalos */
  #casa-cuesta{left:31%;top:38.0%;width:38%;height:6%}
  #amazon{left:31%;top:46.5%;width:38%;height:6%}

  /* Portada a pantalla completa */
  .cover{
    position:fixed;
    inset:0;
    z-index:100;
    background:#f7f1e7;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    overflow:hidden;
    cursor:pointer;
    touch-action:manipulation;
  }
  .cover-stage{
    position:relative;
    width:min(100vw,472px);
    height:100dvh;
    overflow:hidden;
    background:#f8f2e7;
  }

  .cover-image,
  .reveal-image{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
  }

  /* Página 2 debajo de las puertas: pequeño zoom-in para sensación de entrada */
  .reveal-image{
    z-index:1;
    opacity:.80;
    transform:scale(.94);
    filter:blur(.2px);
    transition:
      transform 1.45s cubic-bezier(.22,.61,.36,1),
      opacity 1.10s ease,
      filter 1.10s ease;
  }
  .cover.open .reveal-image{
    transform:scale(1);
    opacity:1;
    filter:blur(0);
  }

  .door-half{
    position:absolute;
    inset:0;
    z-index:3;
    overflow:hidden;
    will-change:transform,opacity;
    transition:
      transform 1.15s cubic-bezier(.65,0,.20,1),
      opacity .95s ease;
  }
  .door-half img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    max-width:none;
  }
  .door-left{
    clip-path:inset(0 50% 0 0);
    transform-origin:left center;
  }
  .door-right{
    clip-path:inset(0 0 0 50%);
    transform-origin:right center;
  }

  .cover.open .door-left{
    transform:perspective(1200px) rotateY(-76deg) translateX(-14%);
    opacity:.18;
  }
  .cover.open .door-right{
    transform:perspective(1200px) rotateY(76deg) translateX(14%);
    opacity:.18;
  }

  .tap-zone{
    position:absolute;
    left:28%;
    top:53%;
    width:44%;
    height:12%;
    z-index:10;
    border:0;
    background:transparent;
    cursor:pointer;
  }

  .cover.done{
    opacity:0;
    pointer-events:none;
    transition:opacity .42s ease;
  }

  /* Segundo movimiento suave cuando entra la página real */
  #opening{
    transform-origin:center top;
  }
  #opening.entry{
    animation:pageEntry 1.05s cubic-bezier(.22,.61,.36,1) both;
  }
  @keyframes pageEntry{
    0%{opacity:.90;transform:scale(.975)}
    100%{opacity:1;transform:scale(1)}
  }

  @media (prefers-reduced-motion:reduce){
    .door-half,.reveal-image,.cover.done{transition-duration:.01ms!important}
    #opening.entry{animation:none!important}
  }
</style>
</head>

<body class="locked">

<div class="cover" id="cover" aria-label="Toca para abrir la invitación">
  <div class="cover-stage">
    <img class="reveal-image" src="assets/02-apertura.png" alt="">
    <div class="door-half door-left">
      <img src="assets/01-portada.png" alt="">
    </div>
    <div class="door-half door-right">
      <img src="assets/01-portada.png" alt="">
    </div>
    <button class="tap-zone" id="openBtn" aria-label="Toca para abrir"></button>
  </div>
</div>

<main class="invite">

  <div class="page-wrap" id="opening">
    <img class="page" src="assets/02-apertura.png" alt="Jeanny y Ariel, 15 de noviembre de 2026">
    <button class="hotspot" id="scroll-details" aria-label="Desliza para descubrir"></button>
  </div>

  <div class="page-wrap" id="wedding-details">
    <img class="page" src="assets/03-boda.png" alt="Información de la boda" loading="eager">

    <a class="hotspot" id="location"
       href="https://maps.app.goo.gl/bXNYkKEkYui6yCsP8?g_st=ic"
       target="_blank" rel="noopener noreferrer"
       aria-label="Ver ubicación de la boda"></a>

    <button class="hotspot" id="scroll-dress"
            aria-label="Desliza para descubrir los detalles"></button>
  </div>

  <div class="page-wrap" id="dress-code">
    <img class="page" src="assets/04-vestuario.png" alt="Código de vestimenta" loading="lazy">

    <a class="hotspot" id="dress-women"
       href="https://www.pinterest.com/turtle_uv94/code-dress-girls/?invite_code=2acb87ba884a4c9c999840964b3e6c9f&sender=549931941906887975"
       target="_blank" rel="noopener noreferrer"
       aria-label="Ver referencias de vestimenta para ellas"></a>

    <a class="hotspot" id="dress-men"
       href="https://www.pinterest.com/turtle_uv94/code-dress-boys/?invite_code=ddfad047927e46b4bc0679652ee8c017&sender=549931941906887975"
       target="_blank" rel="noopener noreferrer"
       aria-label="Ver referencias de vestimenta para ellos"></a>
  </div>

  <div class="page-wrap" id="gift-lists">
    <img class="page" src="assets/05-regalos.png" alt="Listas de regalos" loading="lazy">

    <a class="hotspot" id="casa-cuesta"
       href="https://listaderegalos.casacuesta.com/Event/Jeanny-Ariel?utm_source=share"
       target="_blank" rel="noopener noreferrer"
       aria-label="Ver lista de regalos Casa Cuesta"></a>

    <a class="hotspot" id="amazon"
       href="https://www.amazon.com/wedding/guest-view/SKL6AKIKFPXG"
       target="_blank" rel="noopener noreferrer"
       aria-label="Ver lista de regalos Amazon"></a>
  </div>

</main>

<script>
  const cover = document.getElementById('cover');
  const opening = document.getElementById('opening');
  let openingStarted = false;

  function openInvitation(){
    if(openingStarted) return;
    openingStarted = true;
    cover.classList.add('open');

    // Mantiene la velocidad de puertas que funcionó bien en celular,
    // pero deja respirar un poco el zoom de la página 2.
    setTimeout(() => {
      document.body.classList.remove('locked');
      opening.classList.add('entry');
      window.scrollTo(0,0);
      cover.classList.add('done');

      setTimeout(() => cover.remove(), 450);
    }, 1350);
  }

  document.getElementById('openBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    openInvitation();
  });
  cover.addEventListener('click', openInvitation);

  document.getElementById('scroll-details').addEventListener('click', () => {
    document.getElementById('wedding-details').scrollIntoView({behavior:'smooth', block:'start'});
  });

  document.getElementById('scroll-dress').addEventListener('click', () => {
    document.getElementById('dress-code').scrollIntoView({behavior:'smooth', block:'start'});
  });
</script>

</body>
</html>
